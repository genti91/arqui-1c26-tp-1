config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: artillery-api
  pool: 5000
  phases:
    - name: Warmup
      duration: 60
      arrivalRate: 5
      rampTo: 20
    - name: Ramp to high load
      duration: 120
      arrivalRate: 100
      rampTo: 1200
    - name: Sustained high load
      duration: 180
      arrivalRate: 1200
scenarios:
  - name: Buy USD/ARS nginx-1
    weight: 55
    flow:
      - post:
          url: 'http://localhost:5555/exchange'
          headers:
            Content-Type: application/json
          json:
            baseCurrency: USD
            counterCurrency: ARS
            baseAmount: 5
            baseAccountId: 11
            counterAccountId: 10
  - name: Sell ARS/USD nginx-1
    weight: 45
    flow:
      - post:
          url: 'http://localhost:5555/exchange'
          headers:
            Content-Type: application/json
          json:
            baseCurrency: ARS
            counterCurrency: USD
            baseAmount: 7000
            baseAccountId: 10
            counterAccountId: 11
