services:
  api:
    build: ./app
    environment:
      - 'REDIS_URL=redis://redis:6379'
    depends_on:
      - redis
  redis:
    image: 'redis:8.6.2-alpine'
    command: redis-server --appendonly yes
    volumes:
      - 'redis_data:/data'
  healthchecker:
    build: ./healthchecker
    environment:
      - HEALTHCHECK_INTERVAL_MS=5000
      - HEALTHCHECK_TIMEOUT_MS=2000
      - HEALTHCHECK_FAILURE_THRESHOLD=2
      - HEALTHCHECK_RESTART_COOLDOWN_MS=30000
      - HEALTHCHECK_STARTUP_GRACE_MS=15000
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
  graphite:
    image: 'graphiteapp/graphite-statsd:1.1.10-5'
    volumes:
      - './statsd.config.json:/opt/statsd/config/udp.js'
      - './graphite.storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf'
    ports:
      - '8090:80'
      - '8125:8125/udp'
  grafana:
    image: 'grafana/grafana:11.5.10'
    ports:
      - '80:3000'
    volumes:
      - 'grafana_config:/var/lib/grafana'
  cadvisor:
    image: 'gcr.io/cadvisor/cadvisor:v0.51.0'
    depends_on:
      - graphite
    command: '-storage_driver="statsd" -storage_driver_host="graphite:8125" -storage_driver_db="cadvisor" -storage_driver_buffer_duration="1s" --docker_only=true'
    ports:
      - '8080:8080'
    volumes:
      - '/:/rootfs:ro'
      - '/var/run:/var/run:rw'
      - '/sys:/sys:ro'
      - '/var/lib/docker/:/var/lib/docker:ro'
  nginx-1:
    image: 'nginx:1.29.8'
    depends_on:
      - api
    ports:
      - '5555:80'
    volumes:
      - './nginx_reverse_proxy.conf:/etc/nginx/conf.d/default.conf:ro'
      - './store/static/files:/static:ro'
  nginx-2:
    image: 'nginx:1.29.8'
    depends_on:
      - api
    ports:
      - '5556:80'
    volumes:
      - './nginx_reverse_proxy.conf:/etc/nginx/conf.d/default.conf:ro'
      - './store/static/files:/static:ro'
  nginx-3:
    image: 'nginx:1.29.8'
    depends_on:
      - api
    ports:
      - '5557:80'
    volumes:
      - './nginx_reverse_proxy.conf:/etc/nginx/conf.d/default.conf:ro'
      - './store/static/files:/static:ro'
volumes:
  grafana_config:
    driver: local
  redis_data:
    driver: local
